function resize(){
  // FILL THE WHOLE SCREEN: biggest size that fits (keeps the shape), pixels stay crisp (nearest-neighbour).
  const dpr=window.devicePixelRatio||1;
  const w=window.innerWidth, h=window.innerHeight;
  cv.width=Math.floor(w*dpr); cv.height=Math.floor(h*dpr);
  const fit=Math.min(cv.width/VW,cv.height/VH);
  const ifit=Math.floor(fit);
  scale = (ifit>=1 && fit-ifit<0.08) ? ifit : fit;      // use an exact integer when it's basically the same size
  ox=Math.floor((cv.width-VW*scale)/2); oy=Math.floor((cv.height-VH*scale)/2);
  if(IS_TOUCH){ document.getElementById('pad').style.display='block'; oy=0;   // picture at the top, controls get the spare space below
    const fb=document.getElementById('fsb'); fb.style.top='auto'; fb.style.right='auto'; fb.style.bottom='14px'; fb.style.left=(w/2-20)+'px';
    document.getElementById('rot').style.display = h>w ? 'flex':'none';
    // controls float semi-transparent in the bottom corners, over the picture / black bars
    const S=Math.round(Math.max(40,Math.min(58,h*0.075))), AB=Math.round(S*1.5), m=14;
    const dpx=m, dpy=h-m-3*S, abx=w-m-AB*2-12, aby=h-m-AB-10;
    const pos={};
    JOY.rx=m+76; JOY.ry=h-m-76; if(!JOY.id){ placeJoy(JOY.rx,JOY.ry); }
    document.querySelectorAll('#pad .b').forEach(el=>{ const k=el.dataset.k; el.style.bottom=''; el.style.right='';
      if(pos[k]){ el.style.left=pos[k][0]+'px'; el.style.top=pos[k][1]+'px'; el.style.width=S+'px'; el.style.height=S+'px'; }
      else { el.style.width=AB+'px'; el.style.height=AB+'px'; el.style.left=(k==='a'?abx+AB+12:abx)+'px'; el.style.top=(k==='a'?aby-AB*0.45:aby)+'px'; } });
  }
}

const SPAWNS=[[200,384],[322,300],[480,252],[770,352],[1060,352],[1170,348],[600,252],[120,384]];
let enemies=[];
function spawnEnemies(keepDead){
  const dead=new Set(keepDead?enemies.filter(e=>e.gone).map(e=>e.uid):[]);
  enemies=ENEMIES.map((cfg,i)=>{const s=cfg.spawn||SPAWNS[i%SPAWNS.length]; const off=cfg.spawn?0:Math.floor(i/SPAWNS.length)*30;
    return {uid:i,cfg,x:s[0]+off,y:s[1],hx:s[0]+off,hy:s[1],tx:s[0],ty:s[1],t:Math.random()*3,cool:0,gone:dead.has(i)};});
}

function blocked(x,y){
  if(x<6||x>MW-6||y<46||y>MH-2) return true;
  const fx=x-6,fy=y-4,fw=12,fh=5;
  for(const c of colliders){ if(fx<c[0]+c[2]&&fx+fw>c[0]&&fy<c[1]+c[3]&&fy+fh>c[1]) return true; }
  for(const n of npcs){ if(n.type==='leafy'&&!n.alive) continue; if(Math.abs(n.x-x)<10&&Math.abs(n.y-y)<6) return true; }
  return false;
}

function say(lines,then){ dialog={lines:Array.isArray(lines)?lines:[lines],i:0,chars:0,then}; }
function updateDialog(dt){
  const d=dialog; const full=d.lines[d.i];
  if(d.chars<full.length){ const before=Math.floor(d.chars); d.chars+=dt*45; if(Math.floor(d.chars)>before&&full[before]!==' ') SFX.text(); }
  if(pressed.a||pressed.b){
    if(d.chars<full.length) d.chars=full.length;
    else { d.i++; d.chars=0; if(d.i>=d.lines.length){ const t=d.then; dialog=null; if(t) t(); } }
  }
}

let cam={x:0,y:0}, owFace=null;
function updateOverworld(dt){
  cam.x=clamp(Math.round(P.x-VW/2),0,MW-VW); cam.y=clamp(Math.round(P.y-24-VH/2),0,MH-VH);
  if(dialog){ updateDialog(dt); return; }
  let dx=(held.right?1:0)-(held.left?1:0), dy=(held.down?1:0)-(held.up?1:0);
  const sp=88;
  if(dx||dy){
    if(dx&&dy){dx*=0.7071;dy*=0.7071;}
    P.dir = Math.abs(dx)>Math.abs(dy) ? (dx>0?2:1) : (dy>0?0:3);
    const nx=P.x+dx*sp*dt, ny=P.y+dy*sp*dt;
    if(!blocked(nx,P.y)) P.x=nx; if(!blocked(P.x,ny)) P.y=ny;
    P.anim+=dt*8; P.frame=Math.floor(P.anim)%4;
  } else { P.frame=0; P.anim=0; }
  // talk
  if(pressed.a){
    const fx=P.x+[0,-14,14,0][P.dir], fy=P.y+[12,0,0,-12][P.dir];
    let best=null,bd=22;
    for(const n of npcs){ if(n.type==='leafy'&&!n.alive) continue; const d=Math.hypot(n.x-fx,n.y-fy); if(d<bd){bd=d;best=n;} }
    if(best) talk(best);
  }
  // walk into the dungeon entrance
  if(Math.abs(P.x-ENT.x)<12 && P.y<ENT.y+8 && P.y>ENT.y-6){ if(dun1Done){ if(!ENT.msgCool){ENT.msgCool=true; say(['* Dungeon 1 is quiet now. You already have the pink stone.'],()=>{P.y=ENT.y+16;ENT.msgCool=false;});} } else { enterDungeon(); return; } }
  // enemies wander + touch
  for(const e of enemies){ if(e.gone) continue;
    e.t-=dt; e.cool=Math.max(0,e.cool-dt);
    if(e.t<=0){ e.tx=e.hx+rnd(-34,34); e.ty=e.hy+rnd(-14,14); e.t=rnd(1.5,3.5); }
    const vx=e.tx-e.x, vy=e.ty-e.y, L=Math.hypot(vx,vy);
    if(L>1){ const nx=e.x+vx/L*22*dt, ny=e.y+vy/L*22*dt; if(!blocked(nx,ny)){e.x=nx;e.y=ny;} else e.t=0; }
    if(e.cool<=0 && Math.abs(e.x-P.x)<16 && Math.abs(e.y-P.y)<12) startBattle(e.cfg,e);
  }
  cam.x=clamp(Math.round(P.x-VW/2),0,MW-VW); cam.y=clamp(Math.round(P.y-24-VH/2),0,MH-VH);
}
function talk(n){
  SFX.sel();
  if(n.type==='vill'){ owFace=null; say(n.lines); }
  else if(n.type==='gala'){ owFace=['gala',0,0];
    say(["* ...","* Galamety: So The One came after all.","* Galamety: Find the seven stones, if you can.","* Galamety: I'll be waiting at the end of everything."],()=>{owFace=null;}); }
  else if(n.type==='leafy'){ owFace=['leafy',0,0];
    if(n.questGiven&&dun1Done){ say(["* Leafy: The PINK STONE! You did it!","* Leafy: Six more to go... I'll find out where the next dungeon is.","* Leafy: (TO BE CONTINUED)"],()=>owFace=null); }
    else if(n.questGiven){ say(["* Leafy: DUNGEON 1 is at the far EAST end of the path. Follow the pink arrow!","* Leafy: Pink, white, blue, light blue, red, yellow and green.","* Leafy: The leaves are counting on you."],()=>owFace=null); }
    else say(["* Leafy: Oh! Hello! You must be The One!","* Leafy: I'm Leafy. Welcome to our forest.",
      "* Leafy: ...It used to be a happy place.","* Leafy: But the PAPER COMPANY built a factory here.",
      "* Leafy: They force all the leaves to work there, making paper. Day and night.",
      "* Leafy: There's only one way to stop them...","* Leafy: The SEVEN STONES.",
      "* Leafy: PINK. WHITE. BLUE. LIGHT BLUE.","* Leafy: RED. YELLOW. And GREEN.",
      "* Leafy: Each one is hidden deep in a dungeon.","* Leafy: Please, The One... collect all seven stones for us!",
      "* Leafy: The first one, the PINK STONE, is in DUNGEON 1.","* Leafy: It's a cave with a pink glow at the far EAST end of the path.","* Leafy: Just follow the path to the right! I'll mark it for you.",
      "* Leafy: I believe in you!"],()=>{ owFace=null; n.questGiven=true; state='ending'; endT=0; endKind='quest'; });
  }
}
function drawOverworld(){
  g.drawImage(IMG.ground,cam.x,cam.y,VW,VH,0,0,VW,VH);
  updVillagers();
  const list=[];
  for(const o of DATA.objects){ const x=o.x-o.ax-cam.x, y=o.y-o.ay-cam.y; if(x>VW||y>VH||x+o.w<0||y+o.h<0) continue;
    list.push([o.y,()=>g.drawImage(IMG.atlas,o.sx,o.sy,o.w,o.h,x,y,o.w,o.h)]); }
  for(const n of npcs){
    if(n.type==='vill') list.push([n.y,()=>drawVillager(n)]);
    else if(n.type==='leafy'&&n.alive) list.push([n.y,()=>sprite('leafy',[0,2][Math.floor(T*2)%2],0,n.x-cam.x,n.y-cam.y)]);
    else if(n.type==='gala') list.push([n.y,()=>sprite('gala',0,0,n.x-cam.x,n.y-cam.y)]);
  }
  for(const e of enemies){ if(e.gone) continue; list.push([e.y,()=>{ if(e.cool>0&&Math.floor(T*10)%2) return; sprite('en_'+e.cfg.id,Math.floor(T*6+e.uid)%4,0,e.x-cam.x,e.y-cam.y);}]); }

}

function newDungeon(){ return {room:0,stoneOut:false,rooms:ROOMS.map((r,i)=>{ const st={foes:[],solved:false,bossDone:false,stoneTaken:false};
  r.map.forEach((row,y)=>{ const bx=row.indexOf('B'); if(bx>=0){st.bx=bx;st.by=y;st.b0=[bx,y];} const px=row.indexOf('P'); if(px>=0){st.px=px;st.py=y;} });
  return st; }), ow:{x:P.x,y:P.y}}; }
function tileAt(tx,ty){ const m=ROOMS[D.room].map; if(ty<0||ty>=15||tx<0||tx>=25) return '#'; return m[ty][tx]; }
function solidTile(tx,ty,forBlock){ const c=tileAt(tx,ty), st=D.rooms[D.room];
  if(c==='#') return true; if(c==='G'&&!st.solved) return true;
  if(forBlock&&(c==='D'||c==='E'||c==='G')) return true;
  if(st.bx!==undefined&&st.bx===tx&&st.by===ty) return true;
  if(forBlock&&st.foes.some(f=>!f.gone&&Math.floor(f.x/16)===tx&&Math.floor((f.y-2)/16)===ty)) return true;
  return false; }
function dBlocked(x,y){ const x0=Math.floor((x-6)/16), x1=Math.floor((x+5)/16), y0=Math.floor((y-4)/16), y1=Math.floor((y+1)/16);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(solidTile(tx,ty)) return [tx,ty]; return null; }
function enterRoom(i,from){ D.room=i; const st=D.rooms[i], r=ROOMS[i];
  if(st.bx!==undefined&&!st.solved){ st.bx=st.b0[0]; st.by=st.b0[1]; }   // unsolved puzzle resets when you come back

    return {cfg,x:tx*16+8,y:ty*16+14,hx:tx*16+8,hy:ty*16+14,tx:tx*16+8,ty:ty*16+14,t:0,cool:1.2,gone:!!old,k}; });

function updateDungeon(dt){

    P.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?2:1):(dy>0?0:3);
    const nx=P.x+dx*sp*dt, ny=P.y+dy*sp*dt;
    const hx=dBlocked(nx,P.y); if(!hx) P.x=nx; else tryPush(hx,Math.sign(dx),0,dt);
    const hy=dBlocked(P.x,ny); if(!hy) P.y=ny; else tryPush(hy,0,Math.sign(dy),dt);
    P.anim+=dt*8; P.frame=Math.floor(P.anim)%4;

  if(here==='D'||(here==='G'&&st.solved)){ enterRoom(D.room+1,'south'); return; }
  // enemies
  for(const e of st.foes){ if(e.gone) continue; e.t-=dt; e.cool=Math.max(0,e.cool-dt);
    if(e.t<=0){ e.tx=e.hx+rnd(-28,28); e.ty=e.hy+rnd(-16,16); e.t=rnd(1.2,2.8); }
    const vx=e.tx-e.x, vy=e.ty-e.y, L=Math.hypot(vx,vy);
    if(L>1){ const nx=e.x+vx/L*20*dt, ny=e.y+vy/L*20*dt; if(!dBlocked(nx,ny)){e.x=nx;e.y=ny;} else e.t=0; }

}

function strip(name,fr,x,y,s=1,flip=false){ const im=IMG[name]; if(!im) return; g.save(); g.translate(Math.round(x),Math.round(y)); if(flip) g.scale(-1,1);
  g.drawImage(im,fr*16,0,16,16,-8*s,-8*s,16*s,16*s); g.restore(); }
function drawBullet(u){
  if(u.k==='bomb'){ if(u.st===0){ g.fillStyle='rgba(80,255,220,.25)'; g.fillRect(Math.round(u.tx)-1,Math.round(u.ty)-1,3,3); strip('pr_spore',Math.floor(u.ft*8)%2,u.x,u.y); }
     else strip('pr_spore',u.st===1?2:3,u.x,u.y); return; }
  if(u.k==='spark'){ g.fillStyle=Math.floor(u.life*20)%2?'#7ff5e0':'#fff6a0'; g.fillRect(Math.round(u.x)-1,Math.round(u.y)-1,2,2); return; }
  if(u.k==='blade'||u.k==='torn'){ strip('pr_blade',Math.floor(u.spin)%4,u.x,u.y); return; }
  if(u.k==='slash'){ const bx=B.box; const L=Math.max(bx[2],bx[3]);
    if(u.warn>0){ if(Math.floor(u.warn*16)%2){ g.strokeStyle='rgba(255,80,255,.45)'; g.lineWidth=1; g.beginPath(); g.moveTo(u.x-L,u.y+L*u.dir); g.lineTo(u.x+L,u.y-L*u.dir); g.stroke(); } }
    else { const fr=u.act>0?2:3; for(let k=-8;k<=8;k++) strip('pr_slash',fr,u.x+k*14,u.y-k*14*u.dir,1,u.dir<0); }
    return; }
  if(u.k==='thorn'){ g.fillStyle='#f0e6b0'; g.fillRect(Math.round(u.x)-1,Math.round(u.y)-1,3,3); g.fillStyle='#fff'; g.fillRect(Math.round(u.x),Math.round(u.y),1,1); }
  else if(u.k==='spore'){ g.fillStyle='#cfa0f4'; g.fillRect(Math.round(u.x)-1,Math.round(u.y)-1,3,3); g.fillStyle='#f0dcff'; g.fillRect(Math.round(u.x)-1,Math.round(u.y)-1,1,1); }
  else if(u.k==='leaf'){ g.fillStyle='#86de46'; g.fillRect(Math.round(u.x)-2,Math.round(u.y)-1,4,3); g.fillStyle='#10101a'; g.fillRect(Math.round(u.x),Math.round(u.y)-1,1,3); }
  else if(u.k==='beetle'){ g.fillStyle='#1a1426'; g.fillRect(Math.round(u.x)-4,Math.round(u.y)-3,8,6); g.fillStyle='#b0683c'; g.fillRect(Math.round(u.x)-3,Math.round(u.y)-2,6,4); g.fillStyle='#1a1426'; g.fillRect(Math.round(u.x),Math.round(u.y)-2,1,4); }
  else if(u.k==='spider'){ g.fillStyle='#ddd'; g.fillRect(Math.round(u.x),u.top,1,Math.max(0,Math.round(u.y-u.top))); g.fillStyle='#2a2030'; g.fillRect(Math.round(u.x)-3,Math.round(u.y)-2,7,5); g.fillStyle='#e04060'; g.fillRect(Math.round(u.x)-1,Math.round(u.y)-1,1,1); g.fillRect(Math.round(u.x)+1,Math.round(u.y)-1,1,1); }
  else if(u.k==='seg'){ g.fillStyle=u.head?'#e8c040':'#7cc850'; g.fillRect(Math.round(u.x)-3,Math.round(u.y)-3,6,6); g.fillStyle='#1a1426'; if(u.head){g.fillRect(Math.round(u.x),Math.round(u.y)-2,1,1);} }
  else if(u.k==='hline'||u.k==='vcol'){ const bx=B.box;
    if(u.warn>0){ if(Math.floor(u.warn*16)%2){ g.fillStyle='rgba(255,255,0,.35)'; u.k==='hline'?g.fillRect(bx[0],u.y-2,bx[2],5):g.fillRect(u.x-u.w/2,bx[1],u.w,bx[3]); } }
    else if(u.act>0){ g.fillStyle=u.k==='hline'?'#4c9a3c':'#d03050'; u.k==='hline'?g.fillRect(bx[0],u.y-2,bx[2],5):g.fillRect(u.x-u.w/2,bx[1],u.w,bx[3]);
      g.fillStyle='#fff'; u.k==='hline'?g.fillRect(bx[0],u.y,bx[2],1):g.fillRect(u.x,bx[1],1,bx[3]); } }
}
function menuItems(){
  if(B.phase==='act') return ['Check',...B.cfg.acts.map(a=>a[0])];
  if(B.phase==='mercy') return B.cfg.boss?['Spare']:['Spare','Flee'];
  return [];
}
function updateBattle(dt){
  const b=B; b.t+=dt; b.inv=Math.max(0,b.inv-dt); b.shake=Math.max(0,b.shake-dt); b.flash=Math.max(0,b.flash-dt);
  for(let i=0;i<4;i++) b.box[i]+= (b.target[i]-b.box[i])*Math.min(1,dt*12);
  if(b.dmgText){ b.dmgText.t-=dt; if(b.dmgText.t<=0) b.dmgText=null; }
  if(b.phase==='text'){
    const full=b.msg[b.mi]; if(b.chars<full.length){ const bf=Math.floor(b.chars); b.chars+=dt*50; if(Math.floor(b.chars)>bf&&full[bf]!==' ')SFX.text(); }
    if(pressed.a||pressed.b){ if(b.chars<full.length) b.chars=full.length; else { b.mi++; b.chars=0;
        if(b.mi>=b.msg.length){ if(b.next==='menu'){b.phase='menu';} else if(b.next==='dodge') startDodge(); else if(b.next==='leave') leaveBattle(); else if(b.next==='enemy') enemyTurn(); } } }
    return;
  }
  if(b.phase==='menu'){
    if(pressed.left){b.sel=(b.sel+2)%3;SFX.sel();} if(pressed.right){b.sel=(b.sel+1)%3;SFX.sel();}
    if(pressed.a){ SFX.ok(); b.sub=0;
      if(b.sel===0){ b.phase='fight'; b.fight={x:0,dir:1,done:false,t:0}; }
      else if(b.sel===1) b.phase='act'; else b.phase='mercy'; }
    return;
  }
  if(b.phase==='act'||b.phase==='mercy'){
    const items=menuItems();
    if(pressed.up){b.sub=(b.sub+items.length-1)%items.length;SFX.sel();} if(pressed.down){b.sub=(b.sub+1)%items.length;SFX.sel();}
    if(pressed.b){ b.phase='menu'; return; }
    if(pressed.a){ SFX.ok();
      if(b.phase==='act'){
        if(b.sub===0) bMsg(b.cfg.check.split('\n'),'enemy');
        else { const a=b.cfg.acts[b.sub-1]; b.acts++; const lines=[a[1]]; if(canSpare()) lines.push(`* ${b.cfg.name} doesn't want to fight anymore.`); bMsg(lines,'enemy'); }
      } else {
        if(items[b.sub]==='Flee') endBattle('flee');
        else if(canSpare()) endBattle('spare');
        else bMsg([`* ${b.cfg.name} isn't ready to be spared yet.`,'* (Try ACTing first!)'],'enemy');
      } }
    return;
  }
  if(b.phase==='fight'){
    const f=b.fight;
    if(!f.done){ f.x+=dt*1.1; if(f.x>=1||pressed.a){ f.done=true; f.t=0.8;
        const acc=f.x>=1?0:1-Math.abs(f.x-0.5)*2; const dmg=Math.max(1,Math.round(2+acc*10));
        b.hp=Math.max(0,b.hp-dmg); b.dmgText={v:dmg,t:0.8}; b.shake=0.25; b.flash=0.3; SFX.hit(); } }
    else { f.t-=dt; if(f.t<=0){ if(b.hp<=0) endBattle('win'); else enemyTurn(); } }
    return;
  }
  if(b.phase==='dodge'){
    const bx=b.box, sp=82; const s=b.soul;
    const dx=(held.right?1:0)-(held.left?1:0), dy=(held.down?1:0)-(held.up?1:0);
    s.x=clamp(s.x+dx*sp*dt,bx[0]+5,bx[0]+bx[2]-5); s.y=clamp(s.y+dy*sp*dt,bx[1]+5,bx[1]+bx[3]-5);
    if(b.t<b.dur-0.6) (PATTERNS[b.cfg.pattern]||PATTERNS.thorns)(b,dt,bx);
    updateBullets(dt,bx);
    if(state!=='battle') return;
    if(b.t>=b.dur){ b.bul=[]; b.phase='menu'; b.target=BOX_MENU.slice(); }
  }
}
function drawBattle(){
  const b=B; g.fillStyle='#000'; g.fillRect(0,0,VW,VH);

  const grd=g.createLinearGradient(0,0,0,112); grd.addColorStop(0,'#16241a'); grd.addColorStop(1,'#000'); g.fillStyle=grd; g.fillRect(0,0,VW,112);

  g.fillStyle='rgba(255,240,170,.05)'; g.beginPath(); g.moveTo(150,0); g.lineTo(190,0); g.lineTo(260,112); g.lineTo(220,112); g.fill();
  // enemy
  const sh=b.shake>0?Math.round(rnd(-2,2)):0;

    else sprite(b.cfg.sheet,Math.floor(b.t*(atk?8:4))%4,atk?1:0,200+sh,108-(b.cfg.scale?(b.cfg.scale-2)*8:0),b.cfg.scale||2);

  const bx=b.box.map(Math.round); box(bx[0],bx[1],bx[2],bx[3]);
  if(b.phase==='text'){ const lines=wrap(b.msg[b.mi].slice(0,Math.floor(b.chars)),bx[2]-20); lines.forEach((l,i)=>txt(l,bx[0]+10,bx[1]+8+i*13)); }
  else if(b.phase==='menu'){ txt(`* What will you do?`,bx[0]+10,bx[1]+8); txt(canSpare()?`* ${b.cfg.name} can be SPARED.`:`* ${b.cfg.name} is watching you.`,bx[0]+10,bx[1]+24,canSpare()?'#ff0':'#ccc'); }
  else if(b.phase==='act'||b.phase==='mercy'){ menuItems().forEach((it,i)=>{ const y=bx[1]+6+i*13; if(i===b.sub) drawHeart(bx[0]+14,y+6);
      txt('* '+it,bx[0]+24,y,(b.phase==='mercy'&&it==='Spare'&&canSpare())?'#ff0':'#fff'); }); txt(IS_TOUCH?'B: back':'X: back',bx[0]+bx[2]-8,bx[1]+bx[3]-14,'#888',8,'right'); }
  else if(b.phase==='fight'){ const f=b.fight; const x0=bx[0]+20,w=bx[2]-40,y=bx[1]+bx[3]/2-8;
      g.fillStyle='#232'; g.fillRect(x0,y,w,16); g.fillStyle='#4a4'; g.fillRect(x0+w*0.3,y,w*0.4,16); g.fillStyle='#8f8'; g.fillRect(x0+w*0.45,y,w*0.1,16);
      g.fillStyle='#fff'; g.fillRect(Math.round(x0+w*Math.min(f.x,1))-1,y-3,3,22); if(!f.done) txt(IS_TOUCH?'Tap A!':'Press Z!',200,y+20,'#ff0',10,'center'); }
  else if(b.phase==='dodge'){ g.save(); g.beginPath(); g.rect(bx[0]+2,bx[1]+2,bx[2]-4,bx[3]-4); g.clip(); b.bul.forEach(drawBullet); g.restore();
      if(!(b.inv>0&&Math.floor(b.inv*14)%2)) drawHeart(b.soul.x,b.soul.y); }
  // player hp
  txt(`THE ONE  LV ${P.lv}`,22,197,'#fff',10); txt('HP',140,197,'#fff',10);
  g.fillStyle='#a00'; g.fillRect(160,198,P.max*2,10); g.fillStyle='#ff0'; g.fillRect(160,198,P.hp*2,10); txt(`${P.hp} / ${P.max}`,166+P.max*2,197,'#fff',10);
  // buttons
  ['FIGHT','ACT','MERCY'].forEach((n,i)=>{ const x=30+i*120, y=214; const on=(b.phase==='menu'&&b.sel===i)||(b.phase==='act'&&i===1)||(b.phase==='mercy'&&i===2)||(b.phase==='fight'&&i===0);
    g.strokeStyle=on?'#ff0':'#f80'; g.lineWidth=2; g.strokeRect(x,y,100,20); txt(n,x+58,y+5,on?'#ff0':'#f80',10,'center'); if(on&&b.phase==='menu') drawHeart(x+12,y+10); });
}

// ---------------- title / end / gameover ----------------
let TITLE_BG=null;
function makeTitleBg(){ // pixelated dark-green bands + scattered leaf shapes, built once
  const c=document.createElement('canvas'); c.width=VW; c.height=VH; const t=c.getContext('2d');
  const BANDS=['#0b1f12','#0e2716','#11301b','#143a20','#174325','#1a4c2a'];
  for(let y=0;y<VH;y+=4){ const v=Math.sin(y/VH*Math.PI); const i=Math.min(BANDS.length-1,Math.floor(v*BANDS.length));
    t.fillStyle=BANDS[i]; t.fillRect(0,y,VW,4);
    if(i>0&&y%8===0){ t.fillStyle=BANDS[i-1]; for(let x=(y/4)%2*2;x<VW;x+=4) t.fillRect(x,y,2,2); } } // dithered seam
  let seed=7; const R=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  const LC=['#1f5a2e','#24683a','#2b7a3f','#1b4d29'];
  for(let k=0;k<70;k++){ const x=Math.floor(R()*VW), y=Math.floor(R()*VH); const col=LC[Math.floor(R()*LC.length)]; const fl=R()<0.5;
    t.fillStyle=col; [[0,0],[1,0],[-1,1],[0,1],[1,1],[2,1],[0,2],[1,2],[1,-1]].forEach(([a,b])=>t.fillRect(x+(fl?-a:a),y+b,1,1));
    t.fillStyle='#0a1a0f'; t.fillRect(x,y+3,1,1); }
  // soft glow behind Leafy
  for(let r=76;r>0;r-=8){ t.fillStyle=`rgba(140,230,90,${0.035})`; t.beginPath(); t.arc(200,124,r,0,Math.PI*2); t.fill(); }
  return c;
}
function drawTitle(){
  if(!TITLE_BG) TITLE_BG=makeTitleBg();
  g.drawImage(TITLE_BG,0,0);
  txt('WORLDS',200,12,'#bfe86a',30,'center');
  txt('Leafy Green World',200,48,'#f4f8d0',12,'center');
  // big sinister Leafy (title art only), crisp 4x, slow creepy bob
  const bob=Math.round(Math.sin(T*2)*1.5);
  g.drawImage(IMG.leafy_title,200-64,38+bob,128,160);
  if(Math.floor(T*2)%2) txt(IS_TOUCH?'TAP TO START':'PRESS Z / ENTER',200,214,'#ff0',10,'center');
}

  g.fillStyle='#000'; g.fillRect(0,0,VW,VH);
  if(endKind==='quest'){ txt('YOUR QUEST BEGINS...',200,34,'#bfe86a',18,'center');
    sprite('knight',0,0,168,140,1); sprite('leafy',[0,2][Math.floor(T*2)%2],0,232,140,1);
    const SC=['#ff78c8','#f0f4ff','#325ae6','#78d2ff','#e12832','#ffdc28','#3cc850'];
    SC.forEach((c,i)=>{ const x=128+i*24, y=158+Math.round(Math.sin(T*3+i)*2); g.fillStyle='#111'; g.fillRect(x-4,y-1,9,9);
      g.fillStyle=c; g.fillRect(x-3,y,7,7); g.fillStyle='#fff'; g.fillRect(x-2,y+1,2,2); });
    txt('Find the seven stones. Free the leaves.',200,178,'#fff',10,'center');

  if(endKind==='stone1'){ txt('PINK STONE OBTAINED!',200,30,'#ff78c8',18,'center');
    const y=96+Math.round(Math.sin(T*3)*3); g.fillStyle=`rgba(255,120,200,${0.2+0.1*Math.sin(T*5)})`; g.fillRect(176,y-24,48,48);
    g.fillStyle='#000'; g.fillRect(189,y-13,22,26); g.fillStyle='#ff78c8'; g.fillRect(191,y-11,18,22); g.fillStyle='#ffc0e6'; g.fillRect(193,y-9,6,6); g.fillStyle='#c04890'; g.fillRect(201,y+3,6,6);
    STONE_COLS.forEach((c,i)=>{ const x=128+i*24, yy=146; g.fillStyle='#111'; g.fillRect(x-4,yy-1,9,9); g.fillStyle=i<stones?c:'#333'; g.fillRect(x-3,yy,7,7); });
    txt(`Stones: ${stones}/7`,200,164,'#fff',10,'center');

  if(endT>1.5&&Math.floor(T*2)%2) txt(IS_TOUCH?'tap to keep exploring':'press Z to keep exploring',200,222,'#ff0',10,'center');

function drawGameOver(){
  g.fillStyle='#000'; g.fillRect(0,0,VW,VH); txt('GAME OVER',200,70,'#fff',28,'center');
  txt('Stay determined, The One!',200,120,'#ff0',12,'center'); drawHeart(200,150,'#f22');

// ---------------- main loop ----------------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; T+=dt;
  try{
    if(loaded<names.length){ g.fillStyle='#000'; g.fillRect(0,0,VW,VH); txt('Loading...',200,110,'#fff',12,'center'); }
    else step(dt);
  }catch(err){ showErr(err); }
  for(const k in pressed) delete pressed[k];
  ctx.imageSmoothingEnabled=false; ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(buf,0,0,VW,VH,ox,oy,VW*scale,VH*scale);
  requestAnimationFrame(frame);
}
function step(dt){
  if(state==='title'){ drawTitle(); if(pressed.a){ SFX.ok(); state='overworld'; } }
  else if(state==='overworld'){ updateOverworld(dt); drawOverworld(); }
  else if(state==='dungeon'){ updateDungeon(dt); if(state==='dungeon') drawDungeon(); else if(state==='overworld') drawOverworld(); else if(state==='battle') drawBattle(); }
  else if(state==='battle'){ updateBattle(dt); if(state==='battle') drawBattle(); else if(state==='overworld') drawOverworld(); else if(state==='dungeon') drawDungeon(); }
  else if(state==='ending'){ endT+=dt; drawEnding(); if(endT>1.5&&pressed.a){ state='overworld'; } }
  else if(state==='gameover'){ drawGameOver(); if(T>1&&pressed.a){ P.hp=P.max; P.x=40; P.y=384; P.dir=0; B=null; D=null; spawnEnemies(true); state='overworld'; } }
}
let errShown=false;
function showErr(err){ if(errShown) return; errShown=true; console.error(err); g.fillStyle='#400'; g.fillRect(0,0,VW,40); txt('Error: '+(err&&err.message),4,4,'#fff',8); }
window.addEventListener('error',e=>showErr(e.error||e));

// ---- test hooks: #title #overworld #dialog #battle=<id> #dodge=<id> #boss ----
function applyHash(){
  const h=location.hash.slice(1); if(!h) return;
  const [k,v]=h.split('=');
  if(k==='overworld'){ state='overworld'; P.x=860; P.y=352; }
  if(k==='dialog'){ state='overworld'; P.x=905; P.y=366; P.dir=3; talk(LEAFY); dialog.chars=999; }
  if(k==='battle'||k==='dodge'){ const cfg=ENEMIES.find(e=>e.id===v)||ENEMIES[0]; startBattle(cfg,null); B.phase='menu';
    if(k==='dodge'){ startDodge(); B.box=B.target.slice(); } }
  if(k==='boss'){ startBattle(LEAFY_BOSS,null); startDodge(); B.box=B.target.slice(); }
  if(k==='ending'){ state='ending'; endKind='quest'; endT=2; }
  if(k==='dungeon'){ LEAFY.questGiven=true; enterDungeon(); dialog=null; if(v) enterRoom(+v,'south'); dialog=null; }
}
const waitLoad=setInterval(()=>{ if(loaded>=names.length){ clearInterval(waitLoad); applyHash(); } },20);
window.__G={get D(){return D},get stones(){return stones},get dun1Done(){return dun1Done},ENT,enterRoom:(i,f)=>enterRoom(i,f),get endKind(){return endKind},get state(){return state},P,get B(){return B},get enemies(){return enemies},LEAFY,get dialog(){return dialog}};
requestAnimationFrame(frame);
